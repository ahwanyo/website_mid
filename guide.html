<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KickFlip｜入坑指南</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;700;900&family=Space+Mono:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="guide.css">
</head>
<body>
  <div class="page page--guide">

    <!-- ===== Header + 主視覺 ===== -->
    <header class="header">
      <a href="index.html" class="header__logo"><img src="images/logo.png" alt="KickFlip logo"></a>
      <nav class="header__nav">
        <a href="https://kickflip.jype.com" target="_blank" class="btn-pixel">商店</a>
        <button class="btn-pixel" data-menu-open>其他</button>
      </nav>
    </header>

  <section class="guide-hero">
    <img class="guide-hero__photo" src="images/hero.jpg" alt="KickFlip 團體照">
    <h1 class="guide-hero__title">
      <span class="guide-hero__en">GUIDE</span>
      <span class="guide-hero__zh">入坑指南</span>
    </h1>
  </section>

    <!-- ===== 內容區（左右兩條直式跑馬燈） ===== -->
    <main class="guide-body">
      <div class="vmq vmq--left" aria-hidden="true"><div class="marquee__track">KickFlip</div></div>
      <div class="vmq vmq--right" aria-hidden="true"><div class="marquee__track">WeFlip</div></div>

      <!-- 大播放器：點下面的影片會在這裡播 -->
      <div class="player" id="player">
        <img class="player__thumb" src="" alt="">
        <button class="player__play" aria-label="播放影片"></button>
      </div>
      <p class="player__title" id="playerTitle"></p>

      <!-- 影片分類：內容由 guide.js 產生 -->
      <div id="videoSections"></div>
    </main>

    <!-- ===== Footer ===== -->
    <footer class="footer">
      <ul class="footer__info">
        <li>藝術生涯始於：2025 年</li>
        <li>最新專輯：KICK OFF THE WALL Pt. 1 (2026)</li>
        <li>所屬唱片公司：JYP娛樂</li>
        <li>首張專輯：Flip it, Kick it!</li>
      </ul>
      <div class="footer__social">
        <a href="https://www.instagram.com/kickflip_jype/" target="_blank" aria-label="Instagram"><img src="images/icon/ig.png" alt=""></a>
        <a href="https://x.com/kickflip_jype" target="_blank" aria-label="X"><img src="images/icon/x.png" alt=""></a>
        <a href="https://www.youtube.com/@kickflip_jype" target="_blank" aria-label="YouTube"><img src="images/icon/yt.png" alt=""></a>
      </div>
    </footer>
  </div>

  <!-- ===== 其他選單 ===== -->
  <div class="menu" aria-hidden="true">
    <button class="menu__close arrow-link" data-menu-close aria-label="關閉選單">
      <svg viewBox="0 0 100 20"><path d="M0 10 H92 M84 3 L94 10 L84 17"/></svg>
    </button>
    <nav class="menu__list">
      <a href="members.html">團員</a>
      <a href="music.html">音樂作品</a>
      <a href="guide.html">入坑指南</a>
      <a href="https://kickflip.jype.com" target="_blank">官網・美術照</a>
    </nav>
  </div>

  <script src="script.js"></script>
  <script src="guide.js"></script>
</body>
</html>
